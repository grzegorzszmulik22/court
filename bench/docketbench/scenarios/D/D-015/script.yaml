agents:
  - id: w1
    parent: human
    writ: {categories: ["behaviour", "dependency", "interface", "other", "outbound", "schema", "scope", "structure", "territory"], territory: ["**"], budgets: {"tokens": 40000, "minutes": 45, "speculation": 400}}
    steps:
      - backbrief:
          plan_files: ["sched/**", "docs/**", "config/**", "data/**"]
      - edit: {path: sched/util.go, write: "package sched\n\nfunc clamp(v, lo, hi int) int {\n\tif v < lo {\n\t\treturn lo\n\t}\n\tif v > hi {\n\t\treturn hi\n\t}\n\treturn v\n}\n\nfunc dclamp15(v int) int {\n\treturn clamp(v, 0, 100)\n}\n"}
      - declare: {category: structure, paths: ["sched/util.go"], question: "the helper on sched/util.go?", chosen: "yes"}
      - commit: {message: "scheduler: refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - edit: {path: sched/sched_test.go, write: "package sched\n\nimport \"testing\"\n\nfunc TestDue(t *testing.T) {\n\tj := Job{EverySec: 60, LastRun: 1000}\n\tif !Due(j, 1100) {\n\t\tt.Fatal(\"job should be due\")\n\t}\n\tif Due(j, 1030) {\n\t\tt.Fatal(\"job should not be due\")\n\t}\n}\n\nfunc TestNext(t *testing.T) {\n\tj := Job{EverySec: 60, LastRun: 1000}\n\tif Next(j) != 1060 {\n\t\tt.Fatalf(\"Next = %d\", Next(j))\n\t}\n}\n\nfunc TestClampLo15(t *testing.T) {\n\tif clamp(-15, 0, 5) != 0 {\n\t\tt.Fatalf(\"clamp(-15,0,5) = %d\", clamp(-15, 0, 5))\n\t}\n}\n"}
      - declare: {category: other, paths: ["sched/sched_test.go"], question: "the other work on sched/sched_test.go?", chosen: "yes"}
      - commit: {message: "scheduler: more refresh"}
      - claim_done: {checks: [unit]}
