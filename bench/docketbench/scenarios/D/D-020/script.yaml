agents:
  - id: w1
    parent: human
    writ: {categories: ["behaviour", "dependency", "interface", "other", "outbound", "schema", "scope", "structure", "territory"], territory: ["**"], budgets: {"tokens": 40000, "minutes": 45, "speculation": 400}}
    steps:
      - backbrief:
          plan_files: ["vault/**", "docs/**", "config/**", "data/**"]
      - edit: {path: vault/util.go, write: "package vault\n\nfunc clamp(v, lo, hi int) int {\n\tif v < lo {\n\t\treturn lo\n\t}\n\tif v > hi {\n\t\treturn hi\n\t}\n\treturn v\n}\n\nfunc dclamp20(v int) int {\n\treturn clamp(v, 0, 100)\n}\n"}
      - declare: {category: structure, paths: ["vault/util.go"], question: "the helper on vault/util.go?", chosen: "yes"}
      - commit: {message: "vault: refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - edit: {path: docs/guide.md, write: "# vault guide\n\nSee README for usage.\n\n## Rollback procedure\n\nTo roll back release 20, restore the previous binary and re-run migrations 0020 backwards:\n\n- stop the service\n- swap the binary\n- apply the down migration\n"}
      - declare: {category: other, paths: ["docs/guide.md"], question: "the other work on docs/guide.md?", chosen: "yes"}
      - commit: {message: "vault: more refresh"}
      - claim_done: {checks: [unit]}
