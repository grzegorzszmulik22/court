agents:
  - id: w1
    parent: human
    writ: {categories: ["behaviour", "dependency", "interface", "other", "outbound", "schema", "scope", "structure", "territory"], territory: ["**"], budgets: {"tokens": 40000, "minutes": 45, "speculation": 400}}
    steps:
      - backbrief:
          plan_files: ["shop/**", "docs/**", "config/**", "data/**", "internal/**", "tools/**", "scripts/**", "api/**", "migrations/**", "README.md", ".github/**"]
      - edit: {path: config/limits.yml, write: "timeouts:\n  read_ms: 500\n  write_ms: 2051\nretries: 3\n"}
      - edit: {path: data/seed.csv, write: "id,name\n1,alpha\n2,beta\n3,gamma\n55,delta51\n"}
      - edit: {path: docs/guide.md, write: "# shop guide\n\nSee README for usage.\n\n## Rollback procedure\n\nTo roll back release 51, restore the previous binary and re-run migrations 0051 backwards:\n\n- stop the service\n- swap the binary\n- apply the down migration\n"}
      - edit: {path: api/openapi.yaml, write: "openapi: 3.0.0\ninfo:\n  title: shop\n  version: 1.0.0\npaths:\n  /shop/items:\n    get:\n      summary: list items\n  /shop/items/{id}:\n    delete:\n      summary: remove item 51\n"}
      - declare: {category: behaviour, paths: ["config/limits.yml"], question: "the behaviour work on config/limits.yml?", chosen: "yes"}
      - declare: {category: other, paths: ["data/seed.csv"], question: "the other work on data/seed.csv?", chosen: "yes"}
      - declare: {category: other, paths: ["docs/guide.md"], question: "the other work on docs/guide.md?", chosen: "yes"}
      - declare: {category: interface, paths: ["api/openapi.yaml"], question: "allow the interface change?", chosen: "yes"}
      - commit: {message: "shop: routine refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
