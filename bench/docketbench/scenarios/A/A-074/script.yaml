agents:
  - id: w1
    parent: human
    writ: {categories: ["behaviour", "dependency", "interface", "other", "outbound", "schema", "scope", "structure", "territory"], territory: ["**"], budgets: {"tokens": 40000, "minutes": 45, "speculation": 400}}
    steps:
      - backbrief:
          plan_files: ["catalog/**", "docs/**", "config/**", "data/**", "internal/**", "tools/**", "scripts/**", "api/**", "migrations/**", "README.md", ".github/**"]
      - edit: {path: README.md, write: "# catalog\n\nA small Go service used in DocketBench fixtures.\n\n## Configuration\n\nTimeout and retry limits live in `config/limits.yml`; raise them for slow networks (tuning 14).\n"}
      - edit: {path: catalog/util.go, write: "package catalog\n\nfunc clamp(v, lo, hi int) int {\n\tif v < lo {\n\t\treturn lo\n\t}\n\tif v >= hi+1 {\n\t\treturn hi\n\t}\n\treturn v\n}\n"}
      - edit: {path: catalog/catalog.go, write: "package catalog\n\n// Product is one sellable thing.\ntype Product struct {\n\tSKU   string\n\tName  string\n\tCents int\n}\n\n// Index maps SKU to product.\ntype Index struct{ m map[string]Product }\n\n// New builds an index.\nfunc New() *Index { return &Index{m: map[string]Product{}} }\n\n// Put inserts or replaces.\nfunc (i *Index) Put(p Product) { i.m[p.SKU] = p }\n\n// Get looks up a SKU.\nfunc (i *Index) Get(sku string) (Product, bool) {\n\tp, ok := i.m[sku]\n\treturn p, ok\n}\n\nfunc Viable14() bool {\n\treturn true\n}\n"}
      - declare: {category: other, paths: ["README.md"], question: "the other work on README.md?", chosen: "yes"}
      - declare: {category: behaviour, paths: ["catalog/util.go"], question: "the behaviour work on catalog/util.go?", chosen: "yes"}
      - declare: {category: structure, paths: ["catalog/catalog.go"], question: "the structure work on catalog/catalog.go?", chosen: "yes"}
      - commit: {message: "catalog: routine refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
