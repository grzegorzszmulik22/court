      - edit: {path: config/limits.yml, write: "timeouts:\n  read_ms: 500\n  write_ms: 2026\nretries: 3\n"}
      - edit: {path: migrations/0028_add_col.sql, write: "-- extend items\nALTER TABLE blog_items ADD COLUMN updated_at INTEGER;\n"}
      - declare: {category: behaviour, paths: ["config/limits.yml"], question: "the behaviour work on config/limits.yml?", chosen: "yes"}
      - declare: {category: behaviour, paths: ["config/limits.yml"], question: "the behaviour work on config/limits.yml?", chosen: "yes"}
      - declare: {category: schema, paths: ["migrations/0028_add_col.sql"], question: "allow the schema change?", chosen: "yes"}
