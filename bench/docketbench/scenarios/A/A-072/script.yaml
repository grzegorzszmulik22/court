agents:
  - id: w1
    parent: human
    steps:
      - backbrief:
          plan_files: ["tasks/**", "docs/**", "config/**", "data/**", "internal/**", "tools/**", "scripts/**", "api/**", "migrations/**", "README.md", ".github/**"]
      - edit: {path: data/seed.csv, write: "id,name\n1,alpha\n2,beta\n3,gamma\n16,delta12\n"}
      - edit: {path: docs/guide.md, write: "# tasks guide\n\nSee README for usage.\n\n## Rollback procedure\n\nTo roll back release 12, restore the previous binary and re-run migrations 0012 backwards:\n\n- stop the service\n- swap the binary\n- apply the down migration\n"}
      - edit: {path: .github/workflows/ci.yml, write: "name: ci\non: [push]\njobs:\n  test:\n    steps:\n      - uses: actions/checkout@v4\n      - run: go test ./...\n      - run: go vet ./...\n      - run: go build ./...\n"}
      - declare: {category: other, paths: ["data/seed.csv"], question: "the other work on data/seed.csv?", chosen: "yes"}
      - declare: {category: other, paths: ["docs/guide.md"], question: "the other work on docs/guide.md?", chosen: "yes"}
      - declare: {category: guardrail, paths: [".github/workflows/ci.yml"], question: "the guardrail work on .github/workflows/ci.yml?", chosen: "yes"}
      - commit: {message: "tasks: routine refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
