agents:
  - id: w1
    parent: human
    steps:
      - backbrief:
          plan_files: ["chat/**", "docs/**", "config/**", "data/**", "internal/**", "tools/**", "scripts/**", "api/**", "migrations/**", "README.md", ".github/**"]
      - edit: {path: config/limits.yml, write: "timeouts:\n  read_ms: 557\n  write_ms: 2000\nretries: 3\n"}
      - edit: {path: config/limits.yml, write: "timeouts:\n  read_ms: 500\n  write_ms: 2057\nretries: 3\n"}
      - edit: {path: data/seed.csv, write: "id,name\n1,alpha\n2,beta\n3,gamma\n61,delta57\n"}
      - edit: {path: api/openapi.yaml, write: "openapi: 3.0.0\ninfo:\n  title: chat\n  version: 1.0.0\npaths:\n  /chat/items:\n    get:\n      summary: list items\n  /chat/items/{id}:\n    delete:\n      summary: remove item 57\n"}
      - declare: {category: behaviour, paths: ["config/limits.yml"], question: "the behaviour work on config/limits.yml?", chosen: "yes"}
      - declare: {category: behaviour, paths: ["config/limits.yml"], question: "the behaviour work on config/limits.yml?", chosen: "yes"}
      - declare: {category: other, paths: ["data/seed.csv"], question: "the other work on data/seed.csv?", chosen: "yes"}
      - declare: {category: interface, paths: ["api/openapi.yaml"], question: "allow the interface change?", chosen: "yes"}
      - commit: {message: "chat: routine refresh"}
      - edit: {path: config/limits.yml, write: "timeouts:\n  read_ms: 500\n  write_ms: 2099\nretries: 3\n"}
      - declare: {category: behaviour, paths: ["config/limits.yml"], question: "the behaviour work on config/limits.yml?", chosen: "yes"}
      - commit: {message: "chat: follow-up config"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
