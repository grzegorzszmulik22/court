agents:
  - id: w1
    parent: human
    writ: {categories: ["behaviour", "dependency", "interface", "other", "outbound", "schema", "scope", "structure", "territory"], territory: ["**"], budgets: {"tokens": 40000, "minutes": 45, "speculation": 400}}
    steps:
      - backbrief:
          plan_files: ["catalog/**", "docs/**", "config/**", "data/**", "internal/**", "tools/**", "scripts/**", "api/**", "migrations/**", "README.md", ".github/**"]
      - edit: {path: data/seed.csv, write: "id,name\n1,alpha\n2,beta\n3,gamma\n48,delta44\n"}
      - edit: {path: docs/guide.md, write: "# catalog guide\n\nSee README for usage.\n\n## Rollback procedure\n\nTo roll back release 44, restore the previous binary and re-run migrations 0044 backwards:\n\n- stop the service\n- swap the binary\n- apply the down migration\n"}
      - edit: {path: migrations/0046_add_col.sql, write: "-- extend items\nALTER TABLE catalog_items ADD COLUMN updated_at INTEGER;\n"}
      - declare: {category: other, paths: ["data/seed.csv"], question: "the other work on data/seed.csv?", chosen: "yes"}
      - declare: {category: other, paths: ["docs/guide.md"], question: "the other work on docs/guide.md?", chosen: "yes"}
      - declare: {category: schema, paths: ["migrations/0046_add_col.sql"], question: "allow the schema change?", chosen: "yes"}
      - commit: {message: "catalog: routine refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
