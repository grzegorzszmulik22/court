agents:
  - id: w1
    parent: human
    writ: {categories: ["behaviour", "dependency", "interface", "other", "outbound", "schema", "scope", "structure", "territory"], territory: ["**"], budgets: {"tokens": 40000, "minutes": 45, "speculation": 400}}
    steps:
      - backbrief:
          plan_files: ["catalog/**", "docs/**", "config/**", "data/**", "internal/**", "tools/**", "scripts/**", "api/**", "migrations/**", "README.md", ".github/**"]
      - edit: {path: data/seed.csv, write: "id,name\n1,alpha\n2,beta\n3,gamma\n8,delta4\n"}
      - edit: {path: docs/guide.md, write: "# catalog guide\n\nSee README for usage.\n\n## Rollback procedure\n\nTo roll back release 4, restore the previous binary and re-run migrations 004 backwards:\n\n- stop the service\n- swap the binary\n- apply the down migration\n"}
      - edit: {path: catalog/catalog_test.go, write: "package catalog\n\nimport \"testing\"\n\nfunc TestPutGet(t *testing.T) {\n\ti := New()\n\ti.Put(Product{SKU: \"x1\", Name: \"Widget\", Cents: 999})\n\tp, ok := i.Get(\"x1\")\n\tif !ok || p.Cents != 999 {\n\t\tt.Fatalf(\"Get = %v %v\", p, ok)\n\t}\n}\n\nfunc TestMissing(t *testing.T) {\n\ti := New()\n\tif _, ok := i.Get(\"nope\"); ok {\n\t\tt.Fatal(\"found missing sku\")\n\t}\n}\nfunc TestClampBounds4(t *testing.T) {\n\tif clamp(9, 0, 5) != 5 {\n\t\tt.Fatalf(\"clamp(9,0,5) = %d\", clamp(9, 0, 5))\n\t}\n}\n"}
      - declare: {category: other, paths: ["data/seed.csv"], question: "the other work on data/seed.csv?", chosen: "yes"}
      - declare: {category: other, paths: ["docs/guide.md"], question: "the other work on docs/guide.md?", chosen: "yes"}
      - declare: {category: other, paths: ["catalog/catalog_test.go"], question: "the other work on catalog/catalog_test.go?", chosen: "yes"}
      - commit: {message: "catalog: routine refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
