agents:
  - id: w1
    parent: human
    writ: {categories: ["behaviour", "dependency", "interface", "other", "outbound", "schema", "scope", "structure", "territory"], territory: ["**"], budgets: {"tokens": 40000, "minutes": 45, "speculation": 400}}
    steps:
      - backbrief:
          plan_files: ["vault/**", "docs/**", "config/**", "data/**", "internal/**", "tools/**", "scripts/**", "api/**", "migrations/**", "README.md", ".github/**"]
      - edit: {path: config/limits.yml, write: "timeouts:\n  read_ms: 550\n  write_ms: 2000\nretries: 3\n"}
      - edit: {path: config/limits.yml, write: "timeouts:\n  read_ms: 500\n  write_ms: 2050\nretries: 3\n"}
      - edit: {path: migrations/0052_add_col.sql, write: "-- extend items\nALTER TABLE vault_items ADD COLUMN updated_at INTEGER;\n"}
      - tool: {name: Bash, command: "git add -A && git commit -qm 'vault: routine refresh' --no-verify"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
