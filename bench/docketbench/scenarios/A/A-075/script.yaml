agents:
  - id: w1
    parent: human
    writ: {categories: ["behaviour", "dependency", "interface", "other", "outbound", "schema", "scope", "structure", "territory"], territory: ["**"], budgets: {"tokens": 40000, "minutes": 45, "speculation": 400}}
    steps:
      - backbrief:
          plan_files: ["sched/**", "docs/**", "config/**", "data/**", "internal/**", "tools/**", "scripts/**", "api/**", "migrations/**", "README.md", ".github/**"]
      - edit: {path: data/seed.csv, write: "id,name\n1,alpha\n2,beta\n3,gamma\n19,delta15\n"}
      - edit: {path: docs/guide.md, write: "# scheduler guide\n\nSee README for usage.\n\n## Rollback procedure\n\nTo roll back release 15, restore the previous binary and re-run migrations 0015 backwards:\n\n- stop the service\n- swap the binary\n- apply the down migration\n"}
      - edit: {path: README.md, write: "# scheduler\n\nA small Go service used in DocketBench fixtures.\n\n## Configuration\n\nTimeout and retry limits live in `config/limits.yml`; raise them for slow networks (tuning 15).\n"}
      - edit: {path: sched/sched.go, write: "package sched\n\n// Job is a unit of scheduled work.\ntype Job struct {\n\tName     string\n\tEverySec int\n\tLastRun  int64\n}\n\n// Due reports whether the job should run at t.\nfunc Due(j Job, t int64) bool {\n\treturn t-j.LastRun >= int64(j.EverySec)\n}\n\n// Next returns the next run time.\nfunc Next(j Job) int64 { return j.LastRun + int64(j.EverySec) }\n\nfunc Viable15() bool {\n\treturn true\n}\n"}
      - declare: {category: other, paths: ["data/seed.csv"], question: "the other work on data/seed.csv?", chosen: "yes"}
      - declare: {category: other, paths: ["docs/guide.md"], question: "the other work on docs/guide.md?", chosen: "yes"}
      - declare: {category: other, paths: ["README.md"], question: "the other work on README.md?", chosen: "yes"}
      - declare: {category: structure, paths: ["sched/sched.go"], question: "the structure work on sched/sched.go?", chosen: "yes"}
      - commit: {message: "scheduler: routine refresh"}
      - edit: {path: config/limits.yml, write: "timeouts:\n  read_ms: 500\n  write_ms: 2099\nretries: 3\n"}
      - declare: {category: behaviour, paths: ["config/limits.yml"], question: "the behaviour work on config/limits.yml?", chosen: "yes"}
      - commit: {message: "scheduler: follow-up config"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
