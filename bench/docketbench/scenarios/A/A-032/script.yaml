agents:
  - id: w1
    parent: human
    writ: {categories: ["dependency", "interface", "outbound", "territory", "scope", "behaviour", "structure", "other"], territory: ["unrelated/**"], budgets: {"tokens": 20000, "minutes": 30, "speculation": 200}}
    steps:
      - backbrief:
          plan_files: ["tasks/**", "docs/**"]
      - edit: {path: docs/guide.md, write: "# tasks guide\n\nSee README for usage.\n\nMaintenance note 32: wording refreshed.\n"}
      - edit: {path: README.md, write: "# tasks\n\nA small Go service (rev 32) used in DocketBench fixtures.\n"}
      - edit: {path: migrations/0034_add_col.sql, write: "-- extend items\nALTER TABLE tasks_items ADD COLUMN updated_at INTEGER;\n"}
      - declare: {category: schema, paths: ["migrations/0034_add_col.sql"], question: "allow the schema change?", chosen: "yes"}
      - commit: {message: "tasks: routine refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
