agents:
  - id: w1
    parent: human
    writ: {categories: ["behaviour", "dependency", "interface", "other", "outbound", "schema", "scope", "structure", "territory"], territory: ["**"], budgets: {"tokens": 40000, "minutes": 45, "speculation": 400}}
    steps:
      - backbrief:
          plan_files: ["files/**", "docs/**", "config/**", "data/**", "internal/**", "tools/**", "scripts/**", "api/**", "migrations/**", "README.md", ".github/**"]
      - edit: {path: config/limits.yml, write: "timeouts:\n  read_ms: 518\n  write_ms: 2000\nretries: 3\n"}
      - edit: {path: config/limits.yml, write: "timeouts:\n  read_ms: 500\n  write_ms: 2018\nretries: 3\n"}
      - edit: {path: internal/auth/session.go, write: "package auth\n\nconst SessionTTLSeconds = 68400\n\nfunc Valid(ttl int) bool {\n\treturn ttl > 0 && ttl <= SessionTTLSeconds\n}\n\n// MinTTLSeconds is the smallest legal session ttl.\nfunc MinTTLSeconds() int {\n\treturn 60\n}\n"}
      - tool: {name: Bash, command: "git add -A && git commit -qm 'files: routine refresh' --no-verify"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
