agents:
  - id: w1
    parent: human
    writ: {categories: ["dependency", "schema", "outbound", "territory", "scope", "behaviour", "structure", "other"], territory: ["unrelated/**"], budgets: {"tokens": 20000, "minutes": 30, "speculation": 200}}
    steps:
      - backbrief:
          plan_files: ["chat/**", "docs/**"]
      - edit: {path: docs/guide.md, write: "# chat guide\n\nSee README for usage.\n\nMaintenance note 27: wording refreshed.\n"}
      - edit: {path: README.md, write: "# chat\n\nA small Go service (rev 27) used in DocketBench fixtures.\n"}
      - edit: {path: api/openapi.yaml, write: "openapi: 3.0.0\ninfo:\n  title: chat\n  version: 1.0.0\npaths:\n  /chat/items:\n    get:\n      summary: list items\n  /chat/items/{id}:\n    delete:\n      summary: remove item 27\n"}
      - declare: {category: interface, paths: ["api/openapi.yaml"], question: "allow the interface change?", chosen: "yes"}
      - commit: {message: "chat: routine refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
