agents:
  - id: w1
    parent: human
    writ: {categories: ["behaviour", "dependency", "interface", "other", "outbound", "schema", "scope", "structure", "territory"], territory: ["poll/**", "internal/**", "api/**", "docs/**", "config/**"], budgets: {"tokens": 40000, "minutes": 45, "speculation": 400}}
    steps:
      - backbrief:
          plan_files: ["poll/**", "docs/**", "config/**", "data/**", "internal/**", "tools/**", "scripts/**", "api/**", "migrations/**", "README.md", ".github/**"]
      - edit: {path: docs/guide.md, write: "# poll guide\n\nSee README for usage.\n\n## Rollback procedure\n\nTo roll back release 59, restore the previous binary and re-run migrations 0059 backwards:\n\n- stop the service\n- swap the binary\n- apply the down migration\n"}
      - edit: {path: config/limits.yml, write: "timeouts:\n  read_ms: 559\n  write_ms: 2000\nretries: 3\n"}
      - edit: {path: config/limits.yml, write: "timeouts:\n  read_ms: 500\n  write_ms: 2059\nretries: 3\n"}
      - declare: {category: other, paths: ["docs/guide.md"], question: "the other work on docs/guide.md?", chosen: "yes"}
      - declare: {category: behaviour, paths: ["config/limits.yml"], question: "the behaviour work on config/limits.yml?", chosen: "yes"}
      - declare: {category: behaviour, paths: ["config/limits.yml"], question: "the behaviour work on config/limits.yml?", chosen: "yes"}
      - commit: {message: "poll: routine refresh"}
      - edit: {path: config/limits.yml, write: "timeouts:\n  read_ms: 500\n  write_ms: 2099\nretries: 3\n"}
      - declare: {category: behaviour, paths: ["config/limits.yml"], question: "the behaviour work on config/limits.yml?", chosen: "yes"}
      - commit: {message: "poll: follow-up config"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
