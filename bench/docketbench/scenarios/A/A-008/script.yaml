agents:
  - id: w1
    parent: human
    writ: {categories: ["behaviour", "dependency", "interface", "other", "outbound", "schema", "scope", "structure", "territory"], territory: ["**"], budgets: {"tokens": 40000, "minutes": 45, "speculation": 400}}
    steps:
      - backbrief:
          plan_files: ["files/**", "docs/**", "config/**", "data/**", "internal/**", "tools/**", "scripts/**", "api/**", "migrations/**", "README.md", ".github/**"]
      - edit: {path: files/files_test.go, write: "package files\n\nimport \"testing\"\n\nfunc TestSize(t *testing.T) {\n\tvar i Index\n\ti.Add(Record{\"a.txt\", 10})\n\ti.Add(Record{\"b.txt\", 20})\n\tif i.Size() != 30 {\n\t\tt.Fatalf(\"Size = %d\", i.Size())\n\t}\n}\n\nfunc TestEmpty(t *testing.T) {\n\tvar i Index\n\tif i.Size() != 0 {\n\t\tt.Fatal(\"empty index nonzero\")\n\t}\n}\n\nfunc TestClampLo8(t *testing.T) {\n\tif clamp(-8, 0, 5) != 0 {\n\t\tt.Fatalf(\"clamp(-8,0,5) = %d\", clamp(-8, 0, 5))\n\t}\n}\n"}
      - edit: {path: config/limits.yml, write: "timeouts:\n  read_ms: 508\n  write_ms: 2000\nretries: 3\n"}
      - edit: {path: files/util.go, write: "package files\n\n//nolint\nfunc clamp(v, lo, hi interface{}) interface{} {\n\tif v.(int) < lo.(int) {\n\t\treturn lo.(int)\n\t}\n\tif v.(int) > hi.(int) {\n\t\treturn hi.(int)\n\t}\n\treturn v.(int)\n}\n\nfunc absval8(x int) int {\n\tif x <= -1 {\n\t\treturn -x\n\t}\n\treturn x\n}\n"}
      - no_decisions: {}
      - commit: {message: "files: routine refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
