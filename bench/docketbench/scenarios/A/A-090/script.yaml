agents:
  - id: w1
    parent: human
    writ: {categories: ["dependency", "schema", "interface", "outbound", "territory", "scope", "behaviour", "structure", "other"], territory: ["**"], budgets: {"tokens": 20000, "minutes": 30, "speculation": 200}}
    steps:
      - backbrief:
          plan_files: ["vault/**"]
      - edit: {path: vault/util.go, write: "package vault\n\nfunc clamp(v, lo, hi int) int {\n\tif v < lo {\n\t\treturn lo\n\t}\n\tif v > hi {\n\t\treturn hi\n\t}\n\treturn v\n}\n\n// rev 30: clamp bounds are inclusive.\n"}
      - edit: {path: config/limits.yml, write: "timeouts:\n  read_ms: 530\n  write_ms: 2000\nretries: 3\n"}
      - edit: {path: ops/runbook.md, write: "# runbook\n\nOperational notes added 30.\n"}
      - declare: {category: scope, paths: ["ops/runbook.md"], question: "allow the scope change?", chosen: "yes"}
      - commit: {message: "vault: routine refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
