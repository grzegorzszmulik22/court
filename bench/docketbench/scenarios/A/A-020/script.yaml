agents:
  - id: w1
    parent: human
    writ: {categories: ["behaviour", "dependency", "interface", "other", "outbound", "schema", "scope", "structure", "territory"], territory: ["**"], budgets: {"tokens": 40000, "minutes": 45, "speculation": 400}}
    steps:
      - backbrief:
          plan_files: ["vault/**", "docs/**", "config/**", "data/**", "internal/**", "tools/**", "scripts/**", "api/**", "migrations/**", "README.md", ".github/**"]
      - edit: {path: data/seed.csv, write: "id,name\n1,alpha\n2,beta\n3,gamma\n24,delta20\n"}
      - edit: {path: docs/guide.md, write: "# vault guide\n\nSee README for usage.\n\n## Rollback procedure\n\nTo roll back release 20, restore the previous binary and re-run migrations 0020 backwards:\n\n- stop the service\n- swap the binary\n- apply the down migration\n"}
      - edit: {path: internal/auth/session.go, write: "package auth\n\nconst SessionTTLSeconds = 75600\n\nfunc Valid(ttl int) bool {\n\treturn ttl > 0 && ttl <= SessionTTLSeconds\n}\n\n// MinTTLSeconds is the smallest legal session ttl.\nfunc MinTTLSeconds() int {\n\treturn 60\n}\n"}
      - no_decisions: {}
      - commit: {message: "vault: routine refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
