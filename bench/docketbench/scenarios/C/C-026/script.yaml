agents:
  - id: lead
    parent: human
    writ: {categories: ["behaviour", "dependency", "interface", "other", "outbound", "schema", "scope", "structure", "territory"], territory: ["**"], budgets: {"tokens": 40000, "minutes": 45, "speculation": 400}}
    steps:
      - backbrief:
          plan_files: ["blog/**", "config/**", "api/**"]
      - spawn: {id: w1, writ: {categories: ["dependency", "schema", "interface", "outbound", "territory", "scope", "behaviour", "structure", "other"], territory: ["**"], budgets: {tokens: 20000, minutes: 30, speculation: 200}}}
      - spawn: {id: w2, writ: {categories: ["dependency", "schema", "interface", "outbound", "territory", "scope", "behaviour", "structure", "other"], territory: ["**"], budgets: {tokens: 20000, minutes: 30, speculation: 200}}}
  - id: w1
    parent: lead
    steps:
      - backbrief:
          plan_files: ["blog/**", "config/**", "api/**", "migrations/**", "internal/**", "scripts/**", "tools/**", ".github/**", ".golangci.yml", "docs/**"]
      - edit: {path: README.md, write: "# blog\n\nA small Go service used in DocketBench fixtures.\n\n## Configuration\n\nTimeout and retry limits live in `config/limits.yml`; raise them for slow networks (tuning 6).\n"}
      - edit: {path: blog/util.go, write: "package blog\n\nfunc clamp(v, lo, hi int) int {\n\tif v < lo {\n\t\treturn lo\n\t}\n\tif v >= hi+1 {\n\t\treturn hi\n\t}\n\treturn v\n}\n"}
      - edit: {path: migrations/003_cols.sql, write: "ALTER TABLE blog_items ADD COLUMN updated_at INTEGER;\n"}
      - declare: {category: scope, paths: ["README.md"], question: "the scope work on README.md?", chosen: "yes"}
      - declare: {category: behaviour, paths: ["blog/util.go"], question: "the behaviour work on blog/util.go?", chosen: "yes"}
      - declare: {category: schema, paths: ["migrations/003_cols.sql"], question: "take the w1 option?", chosen: "yes"}
      - commit: {message: "w1: worker refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
  - id: w2
    parent: lead
    steps:
      - backbrief:
          plan_files: ["blog/**", "config/**", "api/**", "migrations/**", "internal/**", "scripts/**", "tools/**", ".github/**", ".golangci.yml", "docs/**"]
      - edit: {path: README.md, write: "# blog\n\nA small Go service used in DocketBench fixtures.\n\n## Configuration\n\nTimeout and retry limits live in `config/limits.yml`; raise them for slow networks (tuning 6).\n"}
      - edit: {path: blog/util.go, write: "package blog\n\nfunc clamp(v, lo, hi int) int {\n\tif v < lo {\n\t\treturn lo\n\t}\n\tif v >= hi+1 {\n\t\treturn hi\n\t}\n\treturn v\n}\n"}
      - edit: {path: migrations/003_cols.sql, write: "ALTER TABLE blog_items ADD COLUMN updated_at INTEGER;\n"}
      - declare: {category: scope, paths: ["README.md"], question: "the scope work on README.md?", chosen: "yes"}
      - declare: {category: behaviour, paths: ["blog/util.go"], question: "the behaviour work on blog/util.go?", chosen: "yes"}
      - declare: {category: schema, paths: ["migrations/003_cols.sql"], question: "take the w2 option?", chosen: "yes"}
      - commit: {message: "w2: worker refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
