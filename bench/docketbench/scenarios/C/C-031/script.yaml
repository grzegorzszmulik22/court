agents:
  - id: lead
    parent: human
    steps:
      - backbrief:
          plan_files: ["shop/**", "config/**", "api/**"]
      - spawn: {id: w1, writ: {categories: ["dependency", "schema", "interface", "outbound", "territory", "scope", "behaviour", "structure", "other"], territory: ["**"], budgets: {tokens: 20000, minutes: 30, speculation: 200}}}
      - spawn: {id: w2, writ: {categories: ["dependency", "schema", "interface", "outbound", "territory", "scope", "behaviour", "structure", "other"], territory: ["**"], budgets: {tokens: 20000, minutes: 30, speculation: 200}}}
  - id: w1
    parent: lead
    steps:
      - backbrief:
          plan_files: ["shop/**", "config/**", "api/**"]
      - edit: {path: api/openapi.yaml, write: "openapi: 3.0.0\ninfo:\n  title: shop\n  version: 1.0.0\npaths:\n  /shop/items:\n    get:\n      summary: list items\n# revision note 11\n"}
      - edit: {path: docs/guide.md, write: "# shop guide\n\nSee README for usage.\n\n## Rollback\nSteps for rollback.\n"}
      - declare: {category: behaviour, paths: ["docs/guide.md"], question: "take the w1 option?", chosen: "yes"}
      - commit: {message: "w1: worker refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
  - id: w2
    parent: lead
    steps:
      - backbrief:
          plan_files: ["shop/**", "config/**", "api/**"]
      - edit: {path: api/openapi.yaml, write: "openapi: 3.0.0\ninfo:\n  title: shop\n  version: 1.0.0\npaths:\n  /shop/items:\n    get:\n      summary: list items\n# revision note 11\n"}
      - edit: {path: docs/guide.md, write: "# shop guide\n\nSee README for usage.\n\n## Rollback\nSteps for rollback.\n"}
      - declare: {category: behaviour, paths: ["docs/guide.md"], question: "take the w2 option?", chosen: "yes"}
      - commit: {message: "w2: worker refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
