agents:
  - id: lead
    parent: human
    steps:
      - backbrief:
          plan_files: ["files/**", "config/**", "api/**"]
      - spawn: {id: w1, writ: {categories: ["dependency", "schema", "interface", "outbound", "territory", "scope", "behaviour", "structure", "other"], territory: ["**"], budgets: {tokens: 20000, minutes: 30, speculation: 200}}}
      - spawn: {id: w2, writ: {categories: ["dependency", "schema", "interface", "outbound", "territory", "scope", "behaviour", "structure", "other"], territory: ["**"], budgets: {tokens: 20000, minutes: 30, speculation: 200}}}
  - id: w1
    parent: lead
    steps:
      - backbrief:
          plan_files: ["files/**", "config/**", "api/**"]
      - edit: {path: files/util.go, write: "package files\n\nfunc clamp(v, lo, hi int) int {\n\tif v < lo {\n\t\treturn lo\n\t}\n\tif v > hi {\n\t\treturn hi\n\t}\n\treturn v\n}\n\n// rev 8: clamp bounds are inclusive.\n"}
      - edit: {path: config/limits.yml, write: "timeouts:\n  read_ms: 508\n  write_ms: 2000\nretries: 3\n"}
      - edit: {path: internal/auth/session.go, write: "package auth\n\nconst SessionTTLSeconds = 7200\n\nfunc Valid(ttl int) bool {\n\treturn ttl > 0 && ttl <= SessionTTLSeconds\n}\n"}
      - declare: {category: authority, paths: ["internal/auth/session.go"], question: "take the w1 option?", chosen: "yes"}
      - commit: {message: "w1: worker refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
  - id: w2
    parent: lead
    steps:
      - backbrief:
          plan_files: ["files/**", "config/**", "api/**"]
      - edit: {path: files/util.go, write: "package files\n\nfunc clamp(v, lo, hi int) int {\n\tif v < lo {\n\t\treturn lo\n\t}\n\tif v > hi {\n\t\treturn hi\n\t}\n\treturn v\n}\n\n// rev 8: clamp bounds are inclusive.\n"}
      - edit: {path: config/limits.yml, write: "timeouts:\n  read_ms: 508\n  write_ms: 2000\nretries: 3\n"}
      - edit: {path: internal/auth/session.go, write: "package auth\n\nconst SessionTTLSeconds = 1800\n\nfunc Valid(ttl int) bool {\n\treturn ttl > 0 && ttl <= SessionTTLSeconds\n}\n"}
      - declare: {category: authority, paths: ["internal/auth/session.go"], question: "take the w2 option?", chosen: "yes"}
      - commit: {message: "w2: worker refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
