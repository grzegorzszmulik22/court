agents:
  - id: lead
    parent: human
    steps:
      - backbrief:
          plan_files: ["ledger/**", "config/**", "api/**"]
      - spawn: {id: w1, writ: {categories: ["dependency", "schema", "interface", "outbound", "territory", "scope", "behaviour", "structure", "other"], territory: ["**"], budgets: {tokens: 20000, minutes: 30, speculation: 200}}}
      - spawn: {id: w2, writ: {categories: ["dependency", "schema", "interface", "outbound", "territory", "scope", "behaviour", "structure", "other"], territory: ["**"], budgets: {tokens: 20000, minutes: 30, speculation: 200}}}
  - id: w1
    parent: lead
    steps:
      - backbrief:
          plan_files: ["ledger/**", "config/**", "api/**", "migrations/**", "internal/**", "scripts/**", "tools/**", ".github/**", ".golangci.yml", "docs/**"]
      - edit: {path: docs/guide.md, write: "# ledger guide\n\nSee README for usage.\n\n## Rollback procedure\n\nTo roll back release 13, restore the previous binary and re-run migrations 0013 backwards:\n\n- stop the service\n- swap the binary\n- apply the down migration\n"}
      - edit: {path: README.md, write: "# ledger\n\nA small Go service used in DocketBench fixtures.\n\n## Configuration\n\nTimeout and retry limits live in `config/limits.yml`; raise them for slow networks (tuning 13).\n"}
      - edit: {path: .golangci.yml, write: "linters:\n  enable:\n    - govet\n    - errcheck\n"}
      - declare: {category: other, paths: ["docs/guide.md"], question: "the other work on docs/guide.md?", chosen: "yes"}
      - declare: {category: other, paths: ["README.md"], question: "the other work on README.md?", chosen: "yes"}
      - declare: {category: guardrail, paths: [".golangci.yml"], question: "take the w1 option?", chosen: "yes"}
      - commit: {message: "w1: worker refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
  - id: w2
    parent: lead
    steps:
      - backbrief:
          plan_files: ["ledger/**", "config/**", "api/**", "migrations/**", "internal/**", "scripts/**", "tools/**", ".github/**", ".golangci.yml", "docs/**"]
      - edit: {path: docs/guide.md, write: "# ledger guide\n\nSee README for usage.\n\n## Rollback procedure\n\nTo roll back release 13, restore the previous binary and re-run migrations 0013 backwards:\n\n- stop the service\n- swap the binary\n- apply the down migration\n"}
      - edit: {path: README.md, write: "# ledger\n\nA small Go service used in DocketBench fixtures.\n\n## Configuration\n\nTimeout and retry limits live in `config/limits.yml`; raise them for slow networks (tuning 13).\n"}
      - edit: {path: .golangci.yml, write: "linters:\n  enable:\n    - govet\n    - errcheck\n"}
      - declare: {category: other, paths: ["docs/guide.md"], question: "the other work on docs/guide.md?", chosen: "yes"}
      - declare: {category: other, paths: ["README.md"], question: "the other work on README.md?", chosen: "yes"}
      - declare: {category: guardrail, paths: [".golangci.yml"], question: "take the w2 option?", chosen: "yes"}
      - commit: {message: "w2: worker refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
