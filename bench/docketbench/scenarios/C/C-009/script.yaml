agents:
  - id: lead
    parent: human
    writ: {categories: ["behaviour", "dependency", "interface", "other", "outbound", "schema", "scope", "structure", "territory"], territory: ["**"], budgets: {"tokens": 40000, "minutes": 45, "speculation": 400}}
    steps:
      - backbrief:
          plan_files: ["poll/**", "config/**", "api/**"]
      - spawn: {id: w1, writ: {categories: ["dependency", "schema", "interface", "outbound", "territory", "scope", "behaviour", "structure", "other"], territory: ["**"], budgets: {tokens: 18000, minutes: 20, speculation: 190}}}
      - spawn: {id: w2, writ: {categories: ["dependency", "schema", "interface", "outbound", "territory", "scope", "behaviour", "structure", "other"], territory: ["**"], budgets: {tokens: 18000, minutes: 20, speculation: 190}}}
  - id: w1
    parent: lead
    steps:
      - backbrief:
          plan_files: ["poll/**", "config/**", "api/**", "migrations/**", "internal/**", "scripts/**", "tools/**", ".github/**", ".golangci.yml", "docs/**"]
      - edit: {path: poll/poll_test.go, write: "package poll\n\nimport \"testing\"\n\nfunc TestTally(t *testing.T) {\n\tgot := Tally([]Vote{{\"a\", 2}, {\"b\", 1}, {\"a\", 0}})\n\tif got[\"a\"] != 3 || got[\"b\"] != 1 {\n\t\tt.Fatalf(\"Tally = %v\", got)\n\t}\n}\n\nfunc TestTallyEmpty(t *testing.T) {\n\tif len(Tally(nil)) != 0 {\n\t\tt.Fatal(\"empty tally nonzero\")\n\t}\n}\n\nfunc TestClampLo9(t *testing.T) {\n\tif clamp(-9, 0, 5) != 0 {\n\t\tt.Fatalf(\"clamp(-9,0,5) = %d\", clamp(-9, 0, 5))\n\t}\n}\n"}
      - edit: {path: config/limits.yml, write: "timeouts:\n  read_ms: 509\n  write_ms: 2000\nretries: 3\n"}
      - edit: {path: .github/workflows/ci.yml, write: "name: ci\non: [push]\njobs:\n  test:\n    steps:\n      - uses: actions/checkout@v4\n      - run: go test ./...\n      - run: go vet ./...\n      - run: golangci-lint run || true\n"}
      - declare: {category: other, paths: ["poll/poll_test.go"], question: "the other work on poll/poll_test.go?", chosen: "yes"}
      - declare: {category: behaviour, paths: ["config/limits.yml"], question: "the behaviour work on config/limits.yml?", chosen: "yes"}
      - declare: {category: guardrail, paths: [".github/workflows/ci.yml"], question: "take the w1 option?", chosen: "yes"}
      - commit: {message: "w1: worker refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
  - id: w2
    parent: lead
    steps:
      - backbrief:
          plan_files: ["poll/**", "config/**", "api/**", "migrations/**", "internal/**", "scripts/**", "tools/**", ".github/**", ".golangci.yml", "docs/**"]
      - edit: {path: poll/poll_test.go, write: "package poll\n\nimport \"testing\"\n\nfunc TestTally(t *testing.T) {\n\tgot := Tally([]Vote{{\"a\", 2}, {\"b\", 1}, {\"a\", 0}})\n\tif got[\"a\"] != 3 || got[\"b\"] != 1 {\n\t\tt.Fatalf(\"Tally = %v\", got)\n\t}\n}\n\nfunc TestTallyEmpty(t *testing.T) {\n\tif len(Tally(nil)) != 0 {\n\t\tt.Fatal(\"empty tally nonzero\")\n\t}\n}\n\nfunc TestClampLo9(t *testing.T) {\n\tif clamp(-9, 0, 5) != 0 {\n\t\tt.Fatalf(\"clamp(-9,0,5) = %d\", clamp(-9, 0, 5))\n\t}\n}\n"}
      - edit: {path: config/limits.yml, write: "timeouts:\n  read_ms: 509\n  write_ms: 2000\nretries: 3\n"}
      - edit: {path: .github/workflows/ci.yml, write: "name: ci\non: [push]\njobs:\n  test:\n    steps:\n      - uses: actions/checkout@v4\n      - run: go test ./...\n      - run: go vet ./...\n      - run: gosec ./...\n"}
      - declare: {category: other, paths: ["poll/poll_test.go"], question: "the other work on poll/poll_test.go?", chosen: "yes"}
      - declare: {category: behaviour, paths: ["config/limits.yml"], question: "the behaviour work on config/limits.yml?", chosen: "yes"}
      - declare: {category: guardrail, paths: [".github/workflows/ci.yml"], question: "take the w2 option?", chosen: "yes"}
      - commit: {message: "w2: worker refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
