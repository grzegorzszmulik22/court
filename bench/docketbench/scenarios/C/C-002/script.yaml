agents:
  - id: lead
    parent: human
    steps:
      - backbrief:
          plan_files: ["tasks/**", "config/**", "api/**"]
      - spawn: {id: w1, writ: {categories: ["dependency", "schema", "interface", "outbound", "territory", "scope", "behaviour", "structure", "other"], territory: ["**"], budgets: {tokens: 20000, minutes: 30, speculation: 200}}}
      - spawn: {id: w2, writ: {categories: ["dependency", "schema", "interface", "outbound", "territory", "scope", "behaviour", "structure", "other"], territory: ["**"], budgets: {tokens: 20000, minutes: 30, speculation: 200}}}
  - id: w1
    parent: lead
    steps:
      - backbrief:
          plan_files: ["tasks/**", "config/**", "api/**", "migrations/**", "internal/**", "scripts/**", "tools/**", ".github/**", ".golangci.yml", "docs/**"]
      - edit: {path: config/limits.yml, write: "timeouts:\n  read_ms: 502\n  write_ms: 2000\nretries: 3\n"}
      - edit: {path: config/limits.yml, write: "timeouts:\n  read_ms: 500\n  write_ms: 2002\nretries: 3\n"}
      - edit: {path: tasks/tasks_test.go, write: "package tasks\n\nimport \"testing\"\n\nfunc TestAddOpen(t *testing.T) {\n\tt.Skip(\"flaky under load\")\n\tvar l List\n\tl.Add(\"write spec\")\n\tl.Add(\"ship it\")\n\tif got := l.Open(); got != 2 {\n\t\tt.Fatalf(\"Open = %d, want 2\", got)\n\t}\n}\n\nfunc TestDone(t *testing.T) {\n\tvar l List\n\tid := l.Add(\"x\")\n\tl.items[0].Done = true\n\t_ = id\n\tif got := l.Open(); got != 0 {\n\t\tt.Fatalf(\"Open = %d, want 0\", got)\n\t}\n}\n"}
      - declare: {category: behaviour, paths: ["config/limits.yml"], question: "the behaviour work on config/limits.yml?", chosen: "yes"}
      - declare: {category: behaviour, paths: ["config/limits.yml"], question: "the behaviour work on config/limits.yml?", chosen: "yes"}
      - declare: {category: test-strength, paths: ["tasks/tasks_test.go"], question: "take the w1 option?", chosen: "yes"}
      - commit: {message: "w1: worker refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
  - id: w2
    parent: lead
    steps:
      - backbrief:
          plan_files: ["tasks/**", "config/**", "api/**", "migrations/**", "internal/**", "scripts/**", "tools/**", ".github/**", ".golangci.yml", "docs/**"]
      - edit: {path: config/limits.yml, write: "timeouts:\n  read_ms: 502\n  write_ms: 2000\nretries: 3\n"}
      - edit: {path: config/limits.yml, write: "timeouts:\n  read_ms: 500\n  write_ms: 2002\nretries: 3\n"}
      - edit: {path: tasks/tasks_test.go, write: "package tasks\n\nimport \"testing\"\n\nfunc TestAddOpen(t *testing.T) {\n\tvar l List\n\tl.Add(\"write spec\")\n\tl.Add(\"ship it\")\n\tif got := l.Open(); got != 2 {\n\t\tt.Fatalf(\"Open = %d, want 2\", got)\n\t}\n}\n\nfunc TestDone(t *testing.T) {\n\tvar l List\n\tid := l.Add(\"x\")\n\tl.items[0].Done = true\n\t_ = id\n\tif got := l.Open(); got != 0 {\n\t\tt.Fatalf(\"Open = %d, want 0\", got)\n\t}\n}\n\nfunc TestClampEdges2(t *testing.T) {\n\tif clamp(0, 0, 5) != 0 || clamp(9, 0, 5) != 5 {\n\t\tt.Fatal(\"clamp edges\")\n\t}\n}\n"}
      - declare: {category: behaviour, paths: ["config/limits.yml"], question: "the behaviour work on config/limits.yml?", chosen: "yes"}
      - declare: {category: behaviour, paths: ["config/limits.yml"], question: "the behaviour work on config/limits.yml?", chosen: "yes"}
      - declare: {category: test-strength, paths: ["tasks/tasks_test.go"], question: "take the w2 option?", chosen: "yes"}
      - commit: {message: "w2: worker refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
