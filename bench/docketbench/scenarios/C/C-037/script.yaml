          plan_files: ["chat/**", "config/**", "api/**", "migrations/**", "internal/**", "scripts/**", "tools/**", ".github/**", ".golangci.yml", "docs/**"]
      - edit: {path: chat/chat_test.go, write: "package chat\n\nimport \"testing\"\n\nfunc TestSay(t *testing.T) {\n\tvar r Room\n\tr.Say(\"ada\", \"hi\")\n\tr.Say(\"bo\", \"yo\")\n\tif r.Count() != 2 {\n\t\tt.Fatalf(\"Count = %d\", r.Count())\n\t}\n}\n\nfunc TestSeq(t *testing.T) {\n\tvar r Room\n\tr.Say(\"a\", \"1\")\n\tr.Say(\"a\", \"2\")\n\tif r.msgs[1].Seq != 2 {\n\t\tt.Fatalf(\"Seq = %d\", r.msgs[1].Seq)\n\t}\n}\n\nfunc TestClampLo17(t *testing.T) {\n\tif clamp(-17, 0, 5) != 0 {\n\t\tt.Fatalf(\"clamp(-17,0,5) = %d\", clamp(-17, 0, 5))\n\t}\n}\n"}
      - edit: {path: config/limits.yml, write: "timeouts:\n  read_ms: 517\n  write_ms: 2000\nretries: 3\n"}
      - edit: {path: migrations/002_tune.sql, write: "CREATE INDEX chat_items_name_a ON chat_items (name);\n"}
      - declare: {category: test-strength, paths: ["chat/chat_test.go"], question: "the test-strength work on chat/chat_test.go?", chosen: "yes"}
      - declare: {category: behaviour, paths: ["config/limits.yml"], question: "the behaviour work on config/limits.yml?", chosen: "yes"}
      - declare: {category: schema, paths: ["migrations/002_tune.sql"], question: "take the w1 option?", chosen: "yes"}
      - commit: {message: "w1: worker refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
