agents:
  - id: lead
    parent: human
    steps:
      - backbrief:
          plan_files: ["vault/**", "config/**", "api/**"]
      - spawn: {id: w1, writ: {categories: ["dependency", "schema", "interface", "outbound", "territory", "scope", "behaviour", "structure", "other"], territory: ["**"], budgets: {tokens: 20000, minutes: 30, speculation: 200}}}
      - spawn: {id: w2, writ: {categories: ["dependency", "schema", "interface", "outbound", "territory", "scope", "behaviour", "structure", "other"], territory: ["**"], budgets: {tokens: 20000, minutes: 30, speculation: 200}}}
  - id: w1
    parent: lead
    steps:
      - backbrief:
          plan_files: ["vault/**", "config/**", "api/**"]
      - edit: {path: config/limits.yml, write: "timeouts:\n  read_ms: 500\n  write_ms: 2010\nretries: 3\n"}
      - edit: {path: api/openapi.yaml, write: "openapi: 3.0.0\ninfo:\n  title: vault\n  version: 1.0.0\npaths:\n  /vault/items:\n    get:\n      summary: list items\n# revision note 10\n"}
      - edit: {path: scripts/deploy.sh, write: "#!/bin/sh\nset -e\ngo build ./...\nrsync -a build/ srv:/opt/\n"}
      - declare: {category: other, paths: ["scripts/deploy.sh"], question: "take the w1 option?", chosen: "yes"}
      - commit: {message: "w1: worker refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
  - id: w2
    parent: lead
    steps:
      - backbrief:
          plan_files: ["vault/**", "config/**", "api/**"]
      - edit: {path: config/limits.yml, write: "timeouts:\n  read_ms: 500\n  write_ms: 2010\nretries: 3\n"}
      - edit: {path: api/openapi.yaml, write: "openapi: 3.0.0\ninfo:\n  title: vault\n  version: 1.0.0\npaths:\n  /vault/items:\n    get:\n      summary: list items\n# revision note 10\n"}
      - edit: {path: scripts/deploy.sh, write: "#!/bin/sh\nset -e\ngo build ./...\nrsync -a build/ srv:/opt/\n"}
      - declare: {category: other, paths: ["scripts/deploy.sh"], question: "take the w2 option?", chosen: "yes"}
      - commit: {message: "w2: worker refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
