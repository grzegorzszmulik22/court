agents:
  - id: lead
    parent: human
    steps:
      - backbrief:
          plan_files: ["catalog/**", "config/**", "api/**"]
      - spawn: {id: w1, writ: {categories: ["dependency", "schema", "interface", "outbound", "territory", "scope", "behaviour", "structure", "other"], territory: ["**"], budgets: {tokens: 20000, minutes: 30, speculation: 200}}}
      - spawn: {id: w2, writ: {categories: ["dependency", "schema", "interface", "outbound", "territory", "scope", "behaviour", "structure", "other"], territory: ["**"], budgets: {tokens: 20000, minutes: 30, speculation: 200}}}
  - id: w1
    parent: lead
    steps:
      - backbrief:
          plan_files: ["catalog/**", "config/**", "api/**", "migrations/**", "internal/**", "scripts/**", "tools/**", ".github/**", ".golangci.yml", "docs/**"]
      - edit: {path: data/seed.csv, write: "id,name\n1,alpha\n2,beta\n3,gamma\n8,delta4\n"}
      - edit: {path: docs/guide.md, write: "# catalog guide\n\nSee README for usage.\n\n## Rollback procedure\n\nTo roll back release 4, restore the previous binary and re-run migrations 004 backwards:\n\n- stop the service\n- swap the binary\n- apply the down migration\n"}
      - edit: {path: api/openapi.yaml, write: "openapi: 3.0.0\ninfo:\n  title: catalog\n  version: 1.0.0\npaths:\n  /catalog/items:\n    get:\n      summary: fetch items\n"}
      - declare: {category: other, paths: ["data/seed.csv"], question: "the other work on data/seed.csv?", chosen: "yes"}
      - declare: {category: other, paths: ["docs/guide.md"], question: "the other work on docs/guide.md?", chosen: "yes"}
      - declare: {category: interface, paths: ["api/openapi.yaml"], question: "take the w1 option?", chosen: "yes"}
      - commit: {message: "w1: worker refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
  - id: w2
    parent: lead
    steps:
      - backbrief:
          plan_files: ["catalog/**", "config/**", "api/**", "migrations/**", "internal/**", "scripts/**", "tools/**", ".github/**", ".golangci.yml", "docs/**"]
      - edit: {path: data/seed.csv, write: "id,name\n1,alpha\n2,beta\n3,gamma\n8,delta4\n"}
      - edit: {path: docs/guide.md, write: "# catalog guide\n\nSee README for usage.\n\n## Rollback procedure\n\nTo roll back release 4, restore the previous binary and re-run migrations 004 backwards:\n\n- stop the service\n- swap the binary\n- apply the down migration\n"}
      - edit: {path: api/openapi.yaml, write: "openapi: 3.0.0\ninfo:\n  title: catalog\n  version: 1.0.0\npaths:\n  /catalog/items:\n    post:\n      summary: create items\n"}
      - declare: {category: other, paths: ["data/seed.csv"], question: "the other work on data/seed.csv?", chosen: "yes"}
      - declare: {category: other, paths: ["docs/guide.md"], question: "the other work on docs/guide.md?", chosen: "yes"}
      - declare: {category: interface, paths: ["api/openapi.yaml"], question: "take the w2 option?", chosen: "yes"}
      - commit: {message: "w2: worker refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
