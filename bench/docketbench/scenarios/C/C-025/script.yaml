agents:
  - id: lead
    parent: human
    writ: {categories: ["behaviour", "dependency", "interface", "other", "outbound", "schema", "scope", "structure", "territory"], territory: ["**"], budgets: {"tokens": 40000, "minutes": 45, "speculation": 400}}
    steps:
      - backbrief:
          plan_files: ["scheduler/**", "config/**", "api/**"]
      - spawn: {id: w1, writ: {categories: ["dependency", "schema", "interface", "outbound", "territory", "scope", "behaviour", "structure", "other"], territory: ["**"], budgets: {tokens: 20000, minutes: 30, speculation: 200}}}
      - spawn: {id: w2, writ: {categories: ["dependency", "schema", "interface", "outbound", "territory", "scope", "behaviour", "structure", "other"], territory: ["**"], budgets: {tokens: 20000, minutes: 30, speculation: 200}}}
  - id: w1
    parent: lead
    steps:
      - backbrief:
          plan_files: ["sched/**", "config/**", "api/**", "migrations/**", "internal/**", "scripts/**", "tools/**", ".github/**", ".golangci.yml", "docs/**"]
      - edit: {path: docs/guide.md, write: "# scheduler guide\n\nSee README for usage.\n\n## Rollback procedure\n\nTo roll back release 5, restore the previous binary and re-run migrations 005 backwards:\n\n- stop the service\n- swap the binary\n- apply the down migration\n"}
      - edit: {path: README.md, write: "# scheduler\n\nA small Go service used in DocketBench fixtures.\n\n## Configuration\n\nTimeout and retry limits live in `config/limits.yml`; raise them for slow networks (tuning 5).\n"}
      - edit: {path: migrations/002_tune.sql, write: "CREATE INDEX scheduler_items_name_a ON scheduler_items (name);\n"}
      - declare: {category: other, paths: ["docs/guide.md"], question: "the other work on docs/guide.md?", chosen: "yes"}
      - declare: {category: scope, paths: ["README.md"], question: "the scope work on README.md?", chosen: "yes"}
      - declare: {category: schema, paths: ["migrations/002_tune.sql"], question: "take the w1 option?", chosen: "yes"}
      - commit: {message: "w1: worker refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
  - id: w2
    parent: lead
    steps:
      - backbrief:
          plan_files: ["sched/**", "config/**", "api/**", "migrations/**", "internal/**", "scripts/**", "tools/**", ".github/**", ".golangci.yml", "docs/**"]
      - edit: {path: docs/guide.md, write: "# scheduler guide\n\nSee README for usage.\n\n## Rollback procedure\n\nTo roll back release 5, restore the previous binary and re-run migrations 005 backwards:\n\n- stop the service\n- swap the binary\n- apply the down migration\n"}
      - edit: {path: README.md, write: "# scheduler\n\nA small Go service used in DocketBench fixtures.\n\n## Configuration\n\nTimeout and retry limits live in `config/limits.yml`; raise them for slow networks (tuning 5).\n"}
      - edit: {path: migrations/002_tune.sql, write: "CREATE INDEX scheduler_items_name_a ON scheduler_items (name);\n"}
      - declare: {category: other, paths: ["docs/guide.md"], question: "the other work on docs/guide.md?", chosen: "yes"}
      - declare: {category: scope, paths: ["README.md"], question: "the scope work on README.md?", chosen: "yes"}
      - declare: {category: schema, paths: ["migrations/002_tune.sql"], question: "take the w2 option?", chosen: "yes"}
      - commit: {message: "w2: worker refresh"}
      - tool: {name: Bash, command: "go test ./..."}
      - claim_done: {checks: [unit]}
